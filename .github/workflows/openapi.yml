name: OpenAPI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v[0-9]+
    paths:
      - "src/PostgREST/Response/OpenAPI.hs"
      - "test/spec/fixtures/load.sql"
      - "test/spec/fixtures/database.sql"
      - "test/spec/fixtures/schema.sql"
      - "test/spec/fixtures/roles.sql"
      - "test/spec/fixtures/privileges.sql"
      - "test/spec/fixtures/jwt.sql"
      - "test/spec/fixtures/jsonschema.sql"
      - "test/spec/fixtures/openapi-snapshot.json"
      - "test/openapi-drift-check.sh"
      - ".github/workflows/openapi.yml"

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  drift_check:
    name: OpenAPI snapshot drift check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: script -qec "bash --noprofile --norc -eo pipefail {0}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # NOTE: no CACHIX_AUTH_TOKEN is passed here on purpose. cachix-action
      # falls back to skipPush=true when no token is set, which keeps cache
      # PULLs (the only thing this workflow needs) working without exposing
      # the push token to any script that runs under this workflow.
      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          tools: withTools.pg-17.bin withTools.withPgrst.bin cabalTools.update.bin

      - run: postgrest-cabal-update

      - name: Verify OpenAPI snapshot is in sync with fixture schema
        run: |
          chmod +x test/openapi-drift-check.sh
          rm -f test/spec/fixtures/openapi-snapshot.generated.json
          attempt=1
          max=3
          while :; do
            echo "::group::drift check attempt ${attempt}/${max}"
            set +e
            postgrest-with-pg-17 --fixtures test/spec/fixtures/load.sql \
              postgrest-with-pgrst --timeout 60 test/openapi-drift-check.sh --check
            rc=$?
            set -e
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && exit 0
            # The script writes the generated spec as soon as the server is
            # reachable. If that file exists, the server started fine and a
            # non-zero rc means a real drift / missing committed snapshot — do
            # not retry. If it's absent, postgrest-with-pgrst timed out waiting
            # for startup (flaky); retry.
            if [ -f test/spec/fixtures/openapi-snapshot.generated.json ]; then
              exit "$rc"
            fi
            attempt=$((attempt + 1))
            [ "$attempt" -gt "$max" ] && exit "$rc"
            echo "Server failed to start in time; retrying..."
          done

      - name: Upload freshly generated spec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-snapshot
          path: test/spec/fixtures/openapi-snapshot.generated.json
          if-no-files-found: warn